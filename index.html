<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#121619">
  <title>AJ Edelman</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      font-family: "Manrope", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #121619;
      color: #faf8f3;
      -webkit-font-smoothing: antialiased;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-width: 280px;
    }

    .hero {
      position: relative;
      isolation: isolate;
      display: grid;
      align-items: end;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      padding: clamp(1.25rem, 5.5vw, 7rem);
      padding-bottom: max(clamp(2.5rem, 8vh, 7rem), env(safe-area-inset-bottom));
      background:
        radial-gradient(ellipse at 70% 25%, #343c42 0%, transparent 65%),
        linear-gradient(145deg, #242b30, #101315 80%);
    }

    .hero__photo,
    .hero::after {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .hero__photo {
      z-index: -2;
    }

    .hero__photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 60% 35%;
      color: transparent;
      font-size: 0;
    }

    .hero::after {
      content: "";
      z-index: -1;
      background:
        linear-gradient(
          180deg,
          rgba(8, 11, 14, 0.25) 0%,
          rgba(8, 11, 14, 0.30) 35%,
          rgba(8, 11, 14, 0.76) 65%,
          rgba(8, 11, 14, 0.94) 100%
        ),
        linear-gradient(
          90deg,
          rgba(8, 11, 14, 0.32),
          rgba(8, 11, 14, 0.08) 75%
        );
    }

    .hero__content {
      padding-top: 12rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.75rem, 11.4vw, 12.5rem);
      font-weight: 600;
      line-height: 1.04;
      letter-spacing: -0.065em;
      text-wrap: balance;
    }

    .tagline {
      margin: clamp(1.25rem, 2.5vw, 2.25rem) 0 0;
      color: #e8e5df;
      font-size: clamp(0.8rem, 1.2vw, 1.125rem);
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: 0.055em;
      text-wrap: balance;
    }

    .tagline__lead { color: #faf8f3; font-weight: 600; }

    @media (max-width: 600px) {
      .hero__photo img {
        object-position: 58% 30%;
      }
    }


    @media (min-width: 900px) {
      .hero__photo { left: 34%; }
      .hero__photo img { object-position: 50% 28%; filter: brightness(0.88) saturate(0.9); }
      .hero::after {
        background:
          linear-gradient(90deg, #0b0e11 0%, #0b0e11 34%, rgba(11,14,17,0.55) 46%, rgba(11,14,17,0) 62%),
          linear-gradient(180deg, rgba(8,11,14,0) 55%, rgba(8,11,14,0.55) 100%);
      }
      .hero__content { max-width: 36%; }
      h1 { font-size: clamp(3.5rem, 7.2vw, 9.5rem); }
    }
    @media (max-width: 899px) {
      .hero__photo img { filter: brightness(0.9); }
    }

    @media (prefers-reduced-motion: no-preference) {
      h1 {
        animation: enter 900ms cubic-bezier(0.22, 1, 0.36, 1) 100ms both;
      }

      .tagline {
        animation: enter 900ms cubic-bezier(0.22, 1, 0.36, 1) 240ms both;
      }

      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    }
  </style>
</head>
<body>
  <main class="hero" aria-labelledby="name">
    <div class="hero__photo">
      <img src="aj-speaking.jpg" alt="AJ Edelman speaking">
    </div>

    <div class="hero__content">
      <h1 id="name">AJ Edelman</h1>
      <p class="tagline"><span class="tagline__lead">2x Olympian</span><br>Speaker, Motivator, Operator</p>
    </div>
  </main>

  <script>
    (() => {
      const photo = document.querySelector(".hero__photo img");
      const showFallback = () => { photo.style.opacity = "0"; };

      photo.addEventListener("error", showFallback, { once: true });
      if (photo.complete && photo.naturalWidth === 0) showFallback();
    })();
  </script>
</body>
</html>
